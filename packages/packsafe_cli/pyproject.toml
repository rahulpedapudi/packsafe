[project]
name = "packsafe"
description = "Analyze and gate package installs on supply-chain risk."
readme = "README.md"
license = "Apache-2.0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Bounded so a future breaking core release cannot silently break every already
    # installed CLI. Raise the ceiling deliberately, never by accident.
    "packsafe-core>=0.1.0,<0.2.0",
    "typer>=0.12",
    "rich>=13.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rahulpedapudi/packsafe"
Issues = "https://github.com/rahulpedapudi/packsafe/issues"

[project.scripts]
packsafe = "packsafe_cli.app:app"

[tool.uv.sources]
packsafe-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packsafe_cli"]
