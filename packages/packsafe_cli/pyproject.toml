[project]
name = "packsafe"
description = "Analyze and gate package installs on supply-chain risk."
readme = "README.md"
license = "Apache-2.0"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    # Floored at the first release carrying the Python 3.11 dataclass fix, so nobody
    # resolving this CLI ends up paired with a core that cannot be imported on 3.11.
    # The ceiling keeps a future breaking core from breaking already-installed CLIs;
    # raise it deliberately.
    "packsafe-core>=0.1.1,<0.2.0",
    "typer>=0.12",
    "rich>=13.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rahulpedapudi/packsafe"
Issues = "https://github.com/rahulpedapudi/packsafe/issues"

[project.scripts]
packsafe = "packsafe_cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
packsafe-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packsafe_cli"]
