[project]
name = "packsafe-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "cvss>=3.6",
    "httpx>=0.27",
    "packaging>=26.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    # packsafe_core.db is part of this package, not the backend: the CLI's `init`
    # command imports it. The [asyncio] extra pulls in greenlet, which SQLAlchemy's
    # async engine requires; without it an installed wheel fails on import.
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packsafe_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
